<!DOCTYPE html>
<html>
<head>
  <title>IAM OAuth Demo - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .navbar { background: #2c3e50; }
    .card { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .profile-pic { width: 80px; height: 80px; border-radius: 50%; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">IAM OAuth Demo</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
  </nav>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body p-4 text-center">
            <img src="{{ user.picture }}" class="profile-pic mb-3">
            <h4>{{ user.name }}</h4>
            <p class="text-muted">{{ user.email }}</p>
            <hr>
            <div class="text-start">
              <h6 class="fw-bold mb-3">Token information</h6>
              <table class="table table-bordered">
                <tr>
                  <td class="fw-bold">Protocol</td>
                  <td>OAuth 2.0 + OpenID Connect</td>
                </tr>
                <tr>
                  <td class="fw-bold">Identity Provider</td>
                  <td>Google</td>
                </tr>
                <tr>
                  <td class="fw-bold">Scope</td>
                  <td>openid email profile</td>
                </tr>
                <tr>
                  <td class="fw-bold">Name claim</td>
                  <td>{{ user.name }}</td>
                </tr>
                <tr>
                  <td class="fw-bold">Email claim</td>
                  <td>{{ user.email }}</td>
                </tr>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
