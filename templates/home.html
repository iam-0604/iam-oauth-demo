<!DOCTYPE html>
<html>
<head>
  <title>IAM OAuth Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .card { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-top: 100px; }
    .card-header { background: #2c3e50; color: white; border-radius: 12px 12px 0 0; padding: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header text-center">
            <h4 class="mb-0">IAM OAuth Demo</h4>
            <small>OAuth 2.0 + OpenID Connect</small>
          </div>
          <div class="card-body p-4 text-center">
            {% if user %}
              <p>You are already logged in as <strong>{{ user.email }}</strong></p>
              <a href="/dashboard" class="btn btn-dark w-100 mb-2">Go to Dashboard</a>
              <a href="/logout" class="btn btn-outline-secondary w-100">Logout</a>
            {% else %}
              <p class="text-muted mb-4">Sign in with your Google account to continue</p>
              <a href="/login" class="btn btn-dark w-100">
                Login with Google
              </a>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
